<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<meta name="theme-color" content="#1d4f91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e3edf0;--card:#f7fafb;--ink:#10283a;--sub:#58707f;
  --key:#ffffff;--fn:#dbe7ec;--op:#1d4f91;--opink:#ffffff;--eq:#15803d;--eqink:#ffffff;--ring:#10283a;--warn:#c2410c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0b1520;--card:#12202e;--ink:#e6eef5;--sub:#8ea5b8;
    --key:#1c2e3f;--fn:#263b50;--op:#5aa2e6;--opink:#04182b;--eq:#34c76f;--eqink:#03200f;--ring:#e6eef5;--warn:#fb923c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0b1520;--card:#12202e;--ink:#e6eef5;--sub:#8ea5b8;
  --key:#1c2e3f;--fn:#263b50;--op:#5aa2e6;--opink:#04182b;--eq:#34c76f;--eqink:#03200f;--ring:#e6eef5;--warn:#fb923c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:12px;
}
.calc{width:min(100%,400px);background:var(--card);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.theme{
  font:inherit;font-size:.8rem;color:var(--sub);background:transparent;
  border:1px solid var(--fn);border-radius:999px;padding:6px 14px;cursor:pointer;
}
.screen{padding:4px 8px 6px;text-align:right;min-height:116px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{color:var(--sub);font-size:1rem;min-height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{
  font-variant-numeric:tabular-nums;font-weight:600;line-height:1.15;
  font-size:3.4rem;white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.main[data-len="m"]{font-size:2.7rem}
.main[data-len="l"]{font-size:2.1rem}
.main[data-len="xl"]{font-size:1.6rem}
.main.err{font-size:1.4rem;color:var(--warn)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{
  font:inherit;font-size:1.5rem;font-weight:400;color:var(--ink);background:var(--key);
  border:0;border-radius:18px;height:clamp(54px,9.5vh,74px);cursor:pointer;touch-action:manipulation;
}
.keys button:active{filter:brightness(.92)}
.keys .fn{background:var(--fn);font-size:1.15rem}
.keys .op{background:var(--op);color:var(--opink);font-size:1.8rem}
.keys .eq{background:var(--eq);color:var(--eqink);font-size:1.8rem;font-weight:600}
button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.hist{list-style:none;margin:0;padding:0 4px;max-height:190px;overflow-y:auto;display:flex;flex-direction:column;font-size:.8rem}
.hist>li:first-child{margin-top:auto}
.hist button{width:100%;display:flex;justify-content:space-between;gap:12px;font:inherit;color:var(--sub);background:transparent;border:0;border-radius:8px;padding:2px 6px;cursor:pointer;text-align:left}
.hist .r{color:var(--ink);font-weight:600;white-space:nowrap}
.hist .e{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .none{color:var(--sub);text-align:right;padding:2px 6px}
[hidden]{display:none!important}
.modewrap{position:relative}
.modebtn{width:100%;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:600;font-size:1rem;color:var(--ink);background:var(--key);border:1px solid var(--fn);border-radius:14px;padding:11px 14px;cursor:pointer}
.menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--key);border:1px solid var(--fn);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:70vh;overflow-y:auto}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font:inherit;color:var(--ink);background:transparent;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.menu button.on{background:var(--op);color:var(--opink)}
.menu button.off{color:var(--sub);opacity:.6}
.menu small{font-size:.72rem}
.pop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:20px}
.pop>div{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;width:min(100%,340px);text-align:center;max-height:92vh;overflow:auto}
.pop p{margin:0 0 16px;line-height:1.5}
.pop button,.retry{font:inherit;color:var(--opink);background:var(--op);border:0;border-radius:12px;padding:10px 22px;cursor:pointer}
.top .theme:last-child{margin-left:auto}
.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sci button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--fn);border:0;border-radius:14px;height:44px;cursor:pointer;touch-action:manipulation}
.sci button:active{filter:brightness(.92)}
.calc[data-mode="sci"] .expr{text-overflow:clip}
.calc[data-mode="sci"] .keys button{height:clamp(46px,7vh,58px)}
.tool{display:flex;flex-direction:column;gap:12px}
.tool label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--sub)}
.tool input,.tool select{font:inherit;font-size:1rem;color:var(--ink);background:var(--key);border:1px solid var(--fn);border-radius:12px;padding:10px 12px;width:100%}
.out{background:var(--key);border-radius:16px;padding:6px 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--fn)}
.row:last-child{border:0}
.row b{text-align:right;word-break:break-word}
.msg{color:var(--sub);margin:8px 0;font-size:.9rem}
.msg a{color:var(--op)}
.pop .seg{display:flex;gap:6px;margin-bottom:12px}
.pop .seg button{flex:1;font:inherit;font-size:.9rem;color:var(--ink);background:var(--fn);border:0;border-radius:10px;padding:9px 6px;cursor:pointer}
.pop .seg button.on{background:var(--op);color:var(--opink)}
.shprev{width:100%;border-radius:12px;margin-bottom:14px;border:1px solid var(--fn)}
.info{background:var(--key);border-radius:14px;padding:10px 14px}
.info summary{cursor:pointer;font-size:.85rem;color:var(--sub)}
.info .msg{margin:8px 0 0}
.retry.swap{width:100%;background:var(--fn);color:var(--ink)}
.sharetxt{white-space:pre-wrap;text-align:left;background:var(--key);border-radius:12px;padding:12px;margin:0 0 14px;font:inherit;font-size:.9rem;max-height:30vh;overflow:auto}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pop .sgrid a,.pop .sgrid button{display:block;font:inherit;font-size:.9rem;text-align:center;text-decoration:none;color:var(--ink);background:var(--fn);border:0;border-radius:12px;padding:11px 6px;cursor:pointer}
.favs{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;border:1px solid var(--fn);border-radius:999px;overflow:hidden;background:var(--key)}
.chip button{font:inherit;font-size:.8rem;color:var(--ink);background:transparent;border:0;padding:6px 10px;cursor:pointer}
.chip button+button{color:var(--sub);padding:6px 10px 6px 2px}
.histbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.histbar .theme{padding:4px 12px;font-size:.75rem}
.tw{overflow:auto;max-height:260px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.78rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--fn);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--key);color:var(--sub);font-weight:600}
.bar{height:12px;border-radius:7px;background:var(--eq);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--op)}
.legend{font-size:.8rem;color:var(--sub);margin:0 0 10px}
.top .theme{padding:6px 9px;font-size:.75rem}
.top{gap:6px}
@media (min-width:700px){.calc{width:420px}}
</style>
</head>
<body>
<main class="calc" data-mode="basic">
  <div class="modewrap"><button class="modebtn" id="modebtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="modename">Basic</span><span aria-hidden="true">▾</span></button><div class="menu" id="menu" hidden></div></div>
  <div class="top">
    <button class="theme" id="hbtn" type="button" aria-controls="histbox" aria-expanded="false">Show history</button>
    <button class="theme" id="sbtn" type="button">Share</button>
    <button class="theme" id="lbtn" type="button" aria-label="Language">हिन्दी</button>
    <button class="theme" id="ibtn" type="button" hidden>Install</button>
    <button class="theme" id="theme" type="button">Dark mode</button>
  </div>
  <div class="histbox" id="histbox" hidden><div class="histbar"><button class="theme" id="hclear" type="button">Clear</button><button class="theme" id="hpdf" type="button">Export PDF</button></div><ol class="hist" id="hist" aria-label="Calculation history"></ol></div>
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="main" id="main" data-len="s">0</div>
  </div>
  <div class="sci" id="sci" hidden>
    <button data-k="sin(">sin</button><button data-k="cos(">cos</button><button data-k="tan(">tan</button><button data-k="(">(</button><button data-k=")">)</button>
    <button data-k="asin(">sin⁻¹</button><button data-k="acos(">cos⁻¹</button><button data-k="atan(">tan⁻¹</button><button data-k="π">π</button><button data-k="e">e</button>
    <button data-k="ln(">ln</button><button data-k="log(">log</button><button data-k="sqrt(">√</button><button data-k="^2">x²</button><button data-k="^">xʸ</button>
    <button data-k="!">x!</button><button data-k="^(-1)">1/x</button><button data-k="10^">10ˣ</button><button data-k="e^">eˣ</button><button data-k="deg" id="degk">DEG</button>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="ac">AC</button>
    <button class="fn" data-k="del">DEL</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/" aria-label="divide">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="multiply">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="subtract">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="add">+</button>
    <button class="fn" data-k="neg" aria-label="plus or minus">+/−</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
  <div class="tool" id="tool" hidden></div>
</main>
<div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="poptxt" hidden><div><p id="poptxt">Internet connection is required for the Currency converter.<br>करेंसी कन्वर्टर के लिए इंटरनेट ज़रूरी है।</p><button type="button" id="popok">OK</button></div></div>
<div class="pop" id="share" role="dialog" aria-modal="true" aria-label="Share" hidden><div><div class="seg" id="shfmt"><button type="button" data-f="text">Text</button><button type="button" data-f="image">Image</button><button type="button" data-f="pdf">PDF</button></div><pre class="sharetxt" id="sharetxt"></pre><img class="shprev" id="shprev" alt="Preview" hidden><div class="sgrid" id="sgrid"></div><p class="msg" id="shnote"></p><button type="button" id="shclose" class="retry swap">Close</button></div></div>
<script>
// CORE START
function createCalc(){
  var DZ="Can’t divide by zero";
  var SYM={"+":"+","-":"−","*":"×","/":"÷"};
  var S;var H=[];
  function reset(){S={cur:"0",prev:null,op:null,waiting:false,just:false,err:"",expr:"",lastOp:null,lastB:null};}
  reset();
  function fmt(n){return String(parseFloat(n.toPrecision(12)));}
  function parse(s){return parseFloat(s);}
  function fail(m){reset();S.err=m;}
  function run(a,op,b){
    if(op==="/"&&b===0){fail(DZ);return null;}
    var r=op==="+"?a+b:op==="-"?a-b:op==="*"?a*b:a/b;
    if(!isFinite(r)){fail("Invalid result");return null;}
    return r;
  }
  function digit(d){
    if(S.just){S.cur="0";S.just=false;S.expr="";}
    if(S.waiting){S.cur="0";S.waiting=false;}
    if(S.cur==="0")S.cur=d;
    else if(S.cur==="-0")S.cur="-"+d;
    else if(S.cur.replace(/[-.]/g,"").length<15)S.cur+=d;
  }
  function dot(){
    if(S.just){S.cur="0";S.just=false;S.expr="";}
    if(S.waiting){S.cur="0";S.waiting=false;}
    if(S.cur.indexOf(".")<0)S.cur+=".";
  }
  function operator(o){
    if(S.op!==null&&!S.waiting){
      var r=run(S.prev,S.op,parse(S.cur));
      if(r===null)return;
      S.prev=r;S.cur=fmt(r);
    }else if(S.op===null){
      S.prev=parse(S.cur);
    }
    S.op=o;S.waiting=true;S.just=false;
    S.expr=fmt(S.prev)+" "+SYM[o];
  }
  function equals(){
    var a,b,op,r;
    if(S.op!==null){a=S.prev;b=parse(S.cur);op=S.op;}
    else if(S.just&&S.lastOp){a=parse(S.cur);b=S.lastB;op=S.lastOp;}
    else return;
    r=run(a,op,b);
    if(r===null)return;
    S.expr=fmt(a)+" "+SYM[op]+" "+fmt(b)+" =";
    S.lastOp=op;S.lastB=b;S.cur=fmt(r);
    S.prev=null;S.op=null;S.waiting=false;S.just=true;
    H.unshift({e:S.expr,r:S.cur});if(H.length>50)H.length=50;
  }
  function percent(){
    var v=parse(S.cur),r;
    if(S.op!==null&&S.prev!==null&&(S.op==="+"||S.op==="-"))r=S.prev*v/100;
    else r=v/100;
    S.cur=fmt(r);S.waiting=false;
  }
  function neg(){
    if(S.waiting){S.cur="0";S.waiting=false;}
    S.cur=S.cur.charAt(0)==="-"?S.cur.slice(1):"-"+S.cur;
  }
  function del(){
    if(S.just||S.waiting)return;
    S.cur=S.cur.slice(0,-1);
    if(S.cur===""||S.cur==="-")S.cur="0";
  }
  function press(k){
    if(S.err){reset();if(k==="ac"||k==="del"||k==="=")return;}
    if(/^\d$/.test(k))digit(k);
    else if(k===".")dot();
    else if(k==="+"||k==="-"||k==="*"||k==="/")operator(k);
    else if(k==="=")equals();
    else if(k==="%")percent();
    else if(k==="neg")neg();
    else if(k==="del")del();
    else if(k==="ac")reset();
  }
  function group(s){
    if(s.indexOf("e")>=0)return s;
    var p=s.split(".");
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
    return p.join(".");
  }
  function view(){
    return S.err?{expr:"",main:S.err,err:true}:{expr:S.expr,main:group(S.cur),err:false};
  }
  function history(){return H.slice();}
  function load(a){
    if(!Array.isArray(a))return;
    H=a.filter(function(x){return x&&typeof x.e==="string"&&typeof x.r==="string"&&isFinite(parseFloat(x.r));}).slice(0,50);
  }
  function recall(i){
    if(!H[i])return;
    reset();S.cur=H[i].r;S.just=true;
  }
  function add(e,r){H.unshift({e:e,r:r});if(H.length>50)H.length=50;}
  function clear(){H.length=0;}
  return {press:press,view:view,history:history,load:load,recall:recall,add:add,clear:clear};
}
// CORE END

var calc=createCalc();
var mainEl=document.getElementById("main"),exprEl=document.getElementById("expr");
function render(){
  var v=calc.view(),n=v.main.length;
  mainEl.textContent=v.main;
  exprEl.innerHTML=v.expr?"":"&nbsp;";
  if(v.expr)exprEl.textContent=v.expr;
  mainEl.classList.toggle("err",v.err);
  mainEl.setAttribute("data-len",n>16?"xl":n>12?"l":n>9?"m":"s");
}
function renderHist(){
  var h=calc.history(),box=document.getElementById("hist"),i,li,b,e,r;
  box.innerHTML="";
  if(!h.length){li=document.createElement("li");li.className="none";li.textContent="Your calculations show here";box.appendChild(li);return;}
  for(i=h.length-1;i>=0;i--){
    li=document.createElement("li");b=document.createElement("button");
    b.type="button";b.setAttribute("data-i",i);
    e=document.createElement("span");e.className="e";e.textContent=h[i].e;
    r=document.createElement("span");r.className="r";r.textContent=h[i].r;
    b.appendChild(e);b.appendChild(r);li.appendChild(b);box.appendChild(li);
  }
  box.scrollTop=box.scrollHeight;
}
function saveHist(){try{localStorage.setItem("hist",JSON.stringify(calc.history()));}catch(err){}}
function loadHist(){try{var raw=localStorage.getItem("hist");if(raw)calc.load(JSON.parse(raw));}catch(err){}}
// PURE START
var DZ2="Can’t divide by zero",S2={s:"",res:"",just:false,deg:true,err:""};
function ME(m){return new Error(m||"Math error");}
function sdisp(s){return s.replace(/sqrt\(/g,"√(").replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−");}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function sciEval(s){
  var o=0,i,t=[],re=/(\d+\.?\d*(?:E[+-]?\d+)?|\.\d+|asin|acos|atan|sin|cos|tan|ln|log|sqrt|π|e|[-+*\/^()!%])/y,m,p=0,n=0,v;
  for(i=0;i<s.length;i++){if(s[i]==="(")o++;else if(s[i]===")")o--;}
  if(o<0)throw ME();
  s+=Array(o+1).join(")");
  while(p<s.length){re.lastIndex=p;m=re.exec(s);if(!m)throw ME();t.push(m[1]);p=re.lastIndex;}
  if(!t.length)return null;
  function pk(){return t[n];}
  function isVal(x){return x!==undefined&&(/^[\d.]/.test(x)||/^(π|e|a?sin|a?cos|a?tan|ln|log|sqrt|\()$/.test(x));}
  function fn(x,a){
    var D=S2.deg,r,q;
    if(x==="sin"||x==="cos"||x==="tan"){
      if(x==="tan"&&D&&(a-90)%180===0)throw ME("Undefined");
      q=D?a*Math.PI/180:a;r=Math[x](q);return Math.abs(r)<1e-15?0:r;
    }
    if(x==="asin"||x==="acos"){if(a<-1||a>1)throw ME();r=Math[x](a);return D?r*180/Math.PI:r;}
    if(x==="atan"){r=Math.atan(a);return D?r*180/Math.PI:r;}
    if(x==="ln"||x==="log"){if(a<=0)throw ME();return x==="ln"?Math.log(a):Math.log10(a);}
    if(x==="sqrt"){if(a<0)throw ME();return Math.sqrt(a);}
    throw ME();
  }
  function pr(){
    var x=t[n++],v,a;
    if(x===undefined)throw ME();
    if(/^[\d.]/.test(x))return parseFloat(x);
    if(x==="π")return Math.PI;
    if(x==="e")return Math.E;
    if(x==="("){v=ex();if(t[n++]!==")")throw ME();return v;}
    if(/^[a-z]+$/.test(x)){if(t[n++]!=="(")throw ME();a=ex();if(t[n++]!==")")throw ME();return fn(x,a);}
    throw ME();
  }
  function pf(){
    var v=pr(),f,j;
    while(pk()==="!"||pk()==="%"){
      if(t[n++]==="!"){if(v<0||v!==Math.floor(v)||v>170)throw ME();f=1;for(j=2;j<=v;j++)f*=j;v=f;}
      else v/=100;
    }
    return v;
  }
  function pw(){var b=pf();if(pk()==="^"){n++;return Math.pow(b,un());}return b;}
  function un(){if(pk()==="-"){n++;return -un();}if(pk()==="+"){n++;return un();}return pw();}
  function tm(){
    var v=un(),x,d;
    for(;;){
      x=pk();
      if(x==="*"){n++;v*=un();}
      else if(x==="/"){n++;d=un();if(d===0)throw ME(DZ2);v/=d;}
      else if(isVal(x))v*=un();

    else if(e.target.tagName==="SELECT")buildTool(raw());
    calcTool();
  });
}
$("hclear").addEventListener("click",function(){calc.clear();saveHist();renderHist();});
$("hpdf").addEventListener("click",exportHist);
document.getElementById("hist").addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(!b)return;
  var i=parseInt(b.getAttribute("data-i"),10);
  if(mode==="sci")sciRecall(calc.history()[i].r);else{calc.recall(i);render();}
});
document.getElementById("keys").addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(b)press(b.getAttribute("data-k"));
});
var KEYMAP={"*":"*","x":"*","X":"*","/":"/","+":"+","-":"-","=":"=","Enter":"=","Backspace":"del","Delete":"ac","Escape":"ac","%":"%",".":".",",":"."};
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey||(mode!=="basic"&&mode!=="sci")||!$("share").hidden||!popEl.hidden)return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)||(e.target.closest("button")&&!e.target.closest(".keys,.sci")))return;
  var k=/^\d$/.test(e.key)?e.key:KEYMAP[e.key]||(mode==="sci"?{"(":"(",")":")","^":"^","!":"!"}[e.key]:undefined);
  if(!k)return;
  e.preventDefault();
  press(k);
});
var root=document.documentElement,themeBtn=document.getElementById("theme");
function isDark(){var t=root.getAttribute("data-theme");return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;}
function label(){themeBtn.textContent=isDark()?"Light mode":"Dark mode";}
try{var saved=localStorage.getItem("theme");if(saved)root.setAttribute("data-theme",saved);}catch(err){}
themeBtn.addEventListener("click",function(){
  var t=isDark()?"light":"dark";
  root.setAttribute("data-theme",t);
  try{localStorage.setItem("theme",t);}catch(err){}
  label();
});
var hbtn=document.getElementById("hbtn"),histEl=document.getElementById("histbox");
hbtn.addEventListener("click",function(){
  var show=histEl.hasAttribute("hidden");
  if(show){histEl.removeAttribute("hidden");$("hist").scrollTop=$("hist").scrollHeight;}else histEl.setAttribute("hidden","");
  hbtn.textContent=show?"Hide history":"Show history";
  hbtn.setAttribute("aria-expanded",show?"true":"false");
});
$("lbtn").addEventListener("click",function(){setLang(LANG==="hi"?"en":"hi");});
var IP=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();IP=e;$("ibtn").hidden=false;});
window.addEventListener("appinstalled",function(){$("ibtn").hidden=true;});
$("ibtn").addEventListener("click",function(){if(!IP)return;IP.prompt();IP.userChoice.then(function(){IP=null;$("ibtn").hidden=true;});});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
label();loadHist();initModes();setMode("basic");renderHist();
try{if(localStorage.getItem("lang")==="hi")setLang("hi");}catch(err){}
</script>
</body>
</html>
